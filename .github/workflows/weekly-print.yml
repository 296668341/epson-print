name: Epson 防堵墨周打印

on:
  schedule:
    # 每周一北京时间 11:00 = UTC 03:00（GitHub 用 UTC 时区）
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # 允许在网页上手动点"Run workflow"立即测试

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: 安装 Pillow
        run: pip install Pillow

      - name: 生成测试页 PDF
        run: python make_testpage.py

      - name: 发送到打印机邮箱
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PRINTER_EMAIL: ${{ secrets.PRINTER_EMAIL }}
        run: python send_mail.py
